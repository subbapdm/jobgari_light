services:
  backend:
    build: ./backend
    ports:
      - "4500:4500"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
  
  frontend:
    build: .
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend